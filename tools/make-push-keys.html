<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make push notification keys</title>
<style>body{font-family:-apple-system,Helvetica,Arial,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;line-height:1.5}
code,textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px}textarea{width:100%;height:64px;padding:8px;border-radius:8px;border:1px solid #ccc}
button{font:inherit;padding:12px 18px;border-radius:12px;border:0;background:#000;color:#fff;cursor:pointer}label{display:block;margin-top:20px;font-weight:600}</style></head>
<body>
<h1>Make push notification keys</h1>
<p>This makes a key pair for coconotes notifications. It runs entirely in your browser; nothing is sent anywhere. Do this once.</p>
<button id="go">Make keys</button>
<label for="pub">Public key: paste into config.js as VAPID_PUBLIC_KEY, and into Supabase as the secret VAPID_PUBLIC_KEY</label><textarea id="pub" readonly></textarea>
<label for="priv">Private key: paste ONLY into Supabase as the secret VAPID_PRIVATE_KEY. Never put it in config.js.</label><textarea id="priv" readonly></textarea>
<script>
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
document.getElementById('go').onclick = async () => {
  const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
  document.getElementById('pub').value = b64u(await crypto.subtle.exportKey('raw', kp.publicKey));
  document.getElementById('priv').value = (await crypto.subtle.exportKey('jwk', kp.privateKey)).d;
};
</script></body></html>
